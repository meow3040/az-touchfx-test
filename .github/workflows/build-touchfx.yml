name: Build and publish Touch FX panel
run-name: Touch FX panel on ${{ github.ref_name }} (run ${{ github.run_number }})

on:
  push:
    branches: [main]
    paths:
      - 'panel/**'
      - '.github/workflows/build-touchfx.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: touchfx-panel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out the SDK recorded in PROVENANCE.json
        uses: actions/checkout@v4
        with:
          repository: Kyle-Hosman/az-mods-sdk
          ref: 3dcaf8f7331ea94135d7161f653edfaf906d5ea6
          path: .azmod-sdk
          persist-credentials: false

      - name: Build the pinned ARM64 SDK toolchain
        run: python3 .azmod-sdk/tools/azmod-pack image

      - name: Run the existing panel regression tests
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/panel:/mod" \
            -v "$PWD/.azmod-sdk/include:/sdk/include:ro" \
            az-mods-sdk:1 sh -eu -c '
              mkdir -p out/tests
              for source in test-geometry.c test-glass-mask.c test-panel.c native/test-native-labels.c native/test-integrated.c; do
                name=$(basename "$source" .c)
                gcc -O2 -I/sdk/include "$source" -o "out/tests/$name" -lm -ldl -pthread
                "out/tests/$name"
              done
            '

      - name: Build and validate the panel library
        run: python3 .azmod-sdk/tools/azmod-pack build panel

      - name: Package the panel for the matching custom core
        run: |
          tag=$(python3 -c 'import json; m=json.load(open("panel/azmod.json")); print(m["id"] + "-" + m["version"])')
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          python3 .azmod-sdk/tools/azmod-pack package panel --out dist \
            --github "$GITHUB_REPOSITORY" --tag "$tag"
          cp INSTALL.md RESTORE.md BUILD.md VERIFICATION.json dist/
          printf '%s\n' \
            'This is the Touch FX panel only, not a complete installation.' \
            'It requires matching custom azmod.so and azstem.so libraries.' \
            'The standard AZ-MODS core does not provide the required custom APIs.' \
            'Read INSTALL.md and BUILD.md before installing. No hardware validation was performed by this workflow.' \
            > dist/REQUIRES-CUSTOM-CORE.txt
          sha256sum dist/*.azmod > dist/SHA256SUMS

      - name: Publish the tested panel as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            mkdir -p work/published
            gh release download "$RELEASE_TAG" --pattern '*.azmod' --dir work/published
            cmp "dist/$RELEASE_TAG.azmod" "work/published/$RELEASE_TAG.azmod" || {
              echo '::error::This version is already published with different bytes. Bump panel/azmod.json version.'
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" \
              "dist/$RELEASE_TAG.azmod" "dist/$RELEASE_TAG-icon.png" \
              dist/SHA256SUMS dist/REQUIRES-CUSTOM-CORE.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Touch FX 0.8.0 - custom core required' \
              --notes-file PACKAGE-RELEASE.md
          fi

      - name: Verify public downloads and publish the Browse entry
        run: |
          git pull --ff-only origin main
          python3 .azmod-sdk/tools/azmod-pack repo add azmods-repo.json "dist/$RELEASE_TAG.entry.json"
          python3 .azmod-sdk/tools/azmod-pack repo check azmods-repo.json --download
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add azmods-repo.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish $RELEASE_TAG to AZ-MODS Browse (custom core required)"
            git push origin HEAD:main
          fi

      - name: Save the validated package and installation requirements
        uses: actions/upload-artifact@v4
        with:
          name: touchfx-0.8.0-panel-requires-custom-core
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Explain the result
        run: |
          printf '%s\n' \
            '## Touch FX panel build' \
            'The five existing panel test programs and SDK package validation passed.' \
            'The artifact contains the panel package only. Matching custom core/audio libraries remain required.' \
            'The prerelease and Browse entry explicitly require the custom core/audio. Nothing was installed on a player.' \
            >> "$GITHUB_STEP_SUMMARY"
